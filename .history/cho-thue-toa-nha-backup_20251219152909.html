<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/swiper-bundle.min.css" />
  <!-- CSS noUiSlider -->
  <link href="https://cdn.jsdelivr.net/npm/nouislider@15.6.1/dist/nouislider.min.css" rel="stylesheet">

  <!-- JS noUiSlider -->
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.6.1/dist/nouislider.min.js"></script>

  <link href="styles/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles/odometer-theme-default.css" />
  <link rel="stylesheet" href="styles/styles.css" />
  <title>Cho thuê tòa nhà văn phòng nguyên căn</title>

  <style>
    .noUi-handle {
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      border: 1px solid #1e3a8a;
      background: white;
      box-shadow: 0 0 0 2px #eff6ff;
      transition: all 0.3s ease;
    }

    .noUi-handle:hover {
      background: #e0f2fe;
    }

    .noUi-connect {
      background: linear-gradient(to right, #1e3a8a, #2563eb);
      border-radius: 9999px;
    }
  </style>

  <!-- styles building rental -->
  <style>
    /* Bubble hover effect – áp cho thẻ a */
    .hover-bubble {
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: color 0.4s ease-in-out;
    }

    .hover-bubble::before {
      content: "";
      position: absolute;
      z-index: -1;
      right: 100%;
      bottom: 100%;
      /* width: 40px; */
      /* height: 25px; */

      width: 200vmax;
      height: 100vmax;

      border-radius: 50%;
      background-color: #ec4899;
      /* pink-500 */
      transform-origin: center;
      /* transform: translate3d(50%, 50%, 0) scale3d(0, 0, 0); */
      transform: translate3d(50%, 50%, 0) scale(0);
      transition: transform 0.45s ease-in-out;
    }

    /* .hover-bubble:hover::before {
      transform: translate3d(50%, 50%, 0) scale3d(15, 15, 15);

    } */

    .hover-bubble:hover::before {
      transform: translate3d(50%, 50%, 0) scale(1);
    }
  </style>
</head>

<body>
  <!-- header -->
  <header id="header" class="sticky left-0 top-0 z-50 flex h-nav-2 items-center bg-white shadow-sm"></header>

  <!-- Navbar ended -->
  <section class="bg-primary-10">
    <div class="w-full h-auto bg-center bg-no-repeat bg-cover" style="background-image: url('assets/images/layer.svg')">
      <div
        class="container flex h-[225px] flex-col items-center justify-center sm:h-[250px] md:h-[300px] lg:h-[350px] xl:h-[400px] 2xl:h-[450px]">
        <h1 data-aos="fade-left" data-aos-anchor="#example-anchor" data-aos-offset="500" data-aos-duration="500"
          data-aos-delay="300" class="common-hero-heading">Cho thuê tòa nhà văn phòng nguyên căn</h1>

        <!-- Breadcrumb -->
        <div id="breadCrumb" data-aos="fade-left" data-aos-anchor="#example-anchor" data-aos-offset="500"
          data-aos-duration="500" class="flex" aria-label="Breadcrumb">
        </div>
      </div>
  </section>

  <!-- Content -->
  <section class="pt-8 pb-4 bg-white">
    <div class="container max-w-screen-xl px-4 mx-auto">
      <!-- Rating start -->
      <div id="ratingStar" data-aos="fade-right" class="flex items-center gap-1 mb-4 text-sm text-gray-600">
      </div>

      <!-- building rental -->
      <div id="buildingRental"></div>
    </div>
  </section>



  </section>

  <!-- footer -->
  <div id="footer"></div>

  <!-- include script -->
  <script src="js/include.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      includeHTML("#header", "./partials/common/header.html");
      includeHTML("#breadCrumb", "./partials/common/bread-crumb.html");
      includeHTML("#ratingStar", "./partials/common/rating-star.html");
      includeHTML("#buildingRental", "./partials/buildingRental/building-rental.html");
      includeHTML("#pagination", "./partials/common/pagination.html");
      includeHTML("#consultingTeam", "./partials/common/consulting-team.html");
      includeHTML("#generalInformation", "./partials/common/general-information.html");
      includeHTML("#footer", "./partials/common/footer.html");
    });
  </script>

  <script>
    function toggleFaq(button) {
      // 1. Lấy phần nội dung (element kế tiếp của button)
      const answer = button.nextElementSibling;

      // 2. Lấy icon mũi tên bên trong button
      const icon = button.querySelector('i');

      // 3. Toggle hiển thị nội dung
      if (answer.classList.contains('hidden')) {
        answer.classList.remove('hidden');
        // Xoay mũi tên lên
        icon.classList.add('rotate-180');
        // Đổi màu title để biết đang active
        button.classList.add('bg-blue-50');
      } else {
        answer.classList.add('hidden');
        // Xoay mũi tên xuống
        icon.classList.remove('rotate-180');
        // Trả lại màu nền trắng
        button.classList.remove('bg-blue-50');
      }
    }
  </script>

  <script>
    function toggleFullInfo() {
      const fullContent = document.getElementById('info-full');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const btn = document.getElementById('toggleInfoBtn');

      if (fullContent.classList.contains('hidden')) {
        // Mở nội dung
        fullContent.classList.remove('hidden');
        btnText.textContent = 'Thu gọn';
        btnIcon.classList.remove('fa-chevron-down');
        btnIcon.classList.add('fa-chevron-up');

        // Scroll nhẹ xuống để người dùng biết đã mở (tuỳ chọn)
        // fullContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        // Đóng nội dung
        fullContent.classList.add('hidden');
        btnText.textContent = 'Xem thêm';
        btnIcon.classList.remove('fa-chevron-up');
        btnIcon.classList.add('fa-chevron-down');

        // Scroll lại lên đầu section
        document.getElementById('general-info-section').scrollIntoView({ behavior: 'smooth' });
      }
    }
  </script>
  <!-- Scripts -->
  <script src="js/fontawesome.min.js"></script>
  <script src="js/flowbite.min.js"></script>
  <script src="js/aos.js"></script>
  <script src="js/odometer.js"></script>
  <script src="js/swiper-bundle.min.js"></script>
  <script src="js/index.js"></script>
  <script>
    AOS.init({
      delay: 0,
      duration: 1000,
    });

    // reviews
    const swiper = new Swiper('.h2-reviews-swiper', {
      slidesPerView: 3,
      pagination: {
        el: '.h2-reviews-swiper-pagination',
        clickable: true,
        dynamicBullets: true,
      },
      autoplay: {
        delay: 2500,
        disableOnInteraction: false,
      },
      breakpoints: {
        0: {
          slidesPerView: 1,
          spaceBetween: 10,
        },
        320: {
          slidesPerView: 2,
          spaceBetween: 10,
        },
        640: {
          slidesPerView: 2,
          spaceBetween: 15,
        },
        768: {
          slidesPerView: 3,
          spaceBetween: 20,
        },
      },
    });

    // agent
    const agent = new Swiper('.h2-agent-swiper', {
      slidesPerView: 3,
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      breakpoints: {
        0: {
          slidesPerView: 1,
          spaceBetween: 10,
        },
        768: {
          slidesPerView: 2,
          spaceBetween: 20,
        },
        1024: {
          slidesPerView: 3,
          spaceBetween: 30,
        },
      },
    });

    // Phường Swiper
    const phuongSwiper = new Swiper('.phuong-swiper', {
      slidesPerView: 4,
      spaceBetween: 24,
      loop: true,
      navigation: {
        nextEl: '.phuong-swiper-button-next',
        prevEl: '.phuong-swiper-button-prev',
      },
      autoplay: {
        delay: 3000,
        disableOnInteraction: false,
      },
      breakpoints: {
        0: {
          slidesPerView: 1,
          spaceBetween: 16,
        },
        640: {
          slidesPerView: 2,
          spaceBetween: 20,
        },
        1024: {
          slidesPerView: 3,
          spaceBetween: 24,
        },
        1280: {
          slidesPerView: 4,
          spaceBetween: 24,
        },
      },
    });

    // Team Swiper
    const teamSwiper = new Swiper('.team-swiper', {
      slidesPerView: 4,
      spaceBetween: 24,
      loop: true,
      speed: 800,
      effect: 'slide',
      grabCursor: true,
      centeredSlides: false,
      navigation: {
        nextEl: '.team-swiper-button-next',
        prevEl: '.team-swiper-button-prev',
      },
      autoplay: {
        delay: 3500,
        disableOnInteraction: false,
        pauseOnMouseEnter: true,
      },
      breakpoints: {
        0: {
          slidesPerView: 1,
          spaceBetween: 16,
        },
        640: {
          slidesPerView: 2,
          spaceBetween: 20,
        },
        1024: {
          slidesPerView: 3,
          spaceBetween: 24,
        },
        1280: {
          slidesPerView: 4,
          spaceBetween: 24,
        },
      },
    });
  </script>

  <!-- filter slide range -->
  <!-- noUiSlider CDN -->
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.6.1/dist/nouislider.min.js"></script>

  <script>
    // Slider diện tích
    const areaSlider = document.getElementById('areaSlider');
    noUiSlider.create(areaSlider, {
      start: [100, 1000], // giá trị mặc định
      connect: true,
      range: {
        min: 10,
        max: 2000
      },
      step: 10,
      tooltips: true,
      format: {
        to: value => Math.round(value),
        from: value => Number(value)
      }
    });

    const areaMinVal = document.getElementById('areaMinVal');
    const areaMaxVal = document.getElementById('areaMaxVal');
    areaSlider.noUiSlider.on('update', (values) => {
      areaMinVal.textContent = values[0];
      areaMaxVal.textContent = values[1];
    });

    // Slider giá thuê
    const priceSlider = document.getElementById('priceSlider');
    noUiSlider.create(priceSlider, {
      start: [20, 50], // giá trị mặc định
      connect: true,
      range: {
        min: 8,
        max: 65
      },
      step: 1,
      tooltips: true,
      format: {
        to: value => Math.round(value),
        from: value => Number(value)
      }
    });

    const priceMinVal = document.getElementById('priceMinVal');
    const priceMaxVal = document.getElementById('priceMaxVal');
    priceSlider.noUiSlider.on('update', (values) => {
      priceMinVal.textContent = values[0];
      priceMaxVal.textContent = values[1];
    });
  </script>


  <!-- filter slide range -->
</body>

</html>
